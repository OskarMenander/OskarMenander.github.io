<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Webbutik</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f3f4f6;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #4CAF50;
            color: white;
            padding: 20px 0;
            text-align: center;
            font-size: 24px;
        }
        .container {
            display: flex;
            padding: 20px;
        }
        .products, .cart {
            width: 50%;
            padding: 20px;
        }
        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .product:hover {
            transform: translateY(-5px);
        }
        .product img {
            max-width: 100%;
            border-radius: 10px;
        }
        .cart {
            border-left: 2px solid #ddd;
            background: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
        }
        button {
            margin-top: 10px;
            padding: 8px 16px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .search-bar {
            text-align: center;
            margin: 20px 0;
        }
        input[type="text"] {
            padding: 10px;
            width: 60%;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>Välkommen till Min Webbutik</header>

    <div class="search-bar">
        <input type="text" id="search" placeholder="Sök efter iPhones (efter 2016) eller Androids (efter 2018)">
        <button onclick="searchProducts()">Sök</button>
    </div>

    <div class="container">
        <div class="products" id="products">
            <h2>Produkter</h2>
        </div>
        <div class="cart" id="cart">
            <h2>Din Kundvagn</h2>
            <ul id="cart-items"></ul>
            <p id="total">Totalt: 0 kr</p>
            <button onclick="checkout()">Betala</button>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: 'iPhone 7', price: 5000, type: 'iPhone', year: 2016, image: 'https://via.placeholder.com/200?text=iPhone+7' },
            { id: 2, name: 'iPhone 8', price: 6000, type: 'iPhone', year: 2017, image: 'https://via.placeholder.com/200?text=iPhone+8' },
            { id: 3, name: 'Samsung Galaxy S9', price: 7000, type: 'Android', year: 2018, image: 'https://via.placeholder.com/200?text=Galaxy+S9' },
            { id: 4, name: 'iPhone 12', price: 12000, type: 'iPhone', year: 2020, image: 'https://via.placeholder.com/200?text=iPhone+12' },
            { id: 5, name: 'Samsung Galaxy S21', price: 13000, type: 'Android', year: 2021, image: 'https://via.placeholder.com/200?text=Galaxy+S21' },
            { id: 6, name: 'iPhone 14', price: 15000, type: 'iPhone', year: 2023, image: 'https://via.placeholder.com/200?text=iPhone+14' },
            { id: 7, name: 'Samsung Galaxy S23', price: 16000, type: 'Android', year: 2023, image: 'https://via.placeholder.com/200?text=Galaxy+S23' },
            { id: 8, name: 'iPhone 15', price: 18000, type: 'iPhone', year: 2024, image: 'https://via.placeholder.com/200?text=iPhone+15' }
        ];

        const cart = [];

        function displayProducts(filterProducts = products) {
            const productsContainer = document.getElementById('products');
            productsContainer.innerHTML = '';
            filterProducts.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.className = 'product';
                productDiv.innerHTML = `
                    <img src="${product.image}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>${product.price} kr</p>
                    <button onclick="addToCart(${product.id})">Lägg till i kundvagn</button>
                `;
                productsContainer.appendChild(productDiv);
            });
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            updateCart();
        }

        function updateCart() {
            const cartItems = document.getElementById('cart-items');
            const totalElement = document.getElementById('total');
            cartItems.innerHTML = '';

            let total = 0;
            cart.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.name} - ${item.price} kr`;
                cartItems.appendChild(li);
                total += item.price;
            });

            totalElement.textContent = `Totalt: ${total} kr`;
        }

        function checkout() {
            alert('Tack för ditt köp!');
            cart.length = 0;
            updateCart();
        }

        function searchProducts() {
            const query = document.getElementById('search').value.toLowerCase();
            const filteredProducts = products.filter(product => {
                return (
                    (product.type.toLowerCase() === 'iphone' && product.year > 2016 && query.includes('iphone')) ||
                    (product.type.toLowerCase() === 'android' && product.year > 2018 && query.includes('android'))
                );
            });
            displayProducts(filteredProducts);
        }

        displayProducts();
    </script>
</body>
</html>
